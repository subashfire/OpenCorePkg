name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

env:
  PROJECT_TYPE: UEFI
  FORCE_INSTALL: 1
  HAS_OPENSSL_BUILD: 1
  HAS_OPENSSL_W32BUILD: 0
  WERROR: 1

jobs:
  build-macos:
    name: macOS XCODE5
    runs-on: macos-latest
    env:
      JOB_TYPE: BUILD
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Toolchain
        run: |
          brew tap --force FiloSottile/homebrew-musl-cross
          brew trust FiloSottile/musl-cross
          brew install musl-cross

      - name: Install Dependencies
        run: brew install openssl mingw-w64 nasm

      - name: CI Bootstrap
        run: |
          src=$(/usr/bin/curl -LfsS https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh) && eval "$src" || exit 1

      - run: ./build_duet.tool
      - run: ./build_oc.tool

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS XCODE5 Artifacts
          path: Binaries/*.zip
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd # v2.9.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Binaries/*.zip
          tag: ${{ github.ref }}
          file_glob: true

  build-linux-clangpdb:
    name: Linux CLANGPDB
    runs-on: ubuntu-22.04
    env:
      TOOLCHAINS: CLANGPDB
    steps:
      - uses: actions/checkout@v4
      - name: Use Docker in rootless mode.
        uses: ScribeMD/rootless-docker@0.2.2
      - name: ./build_duet.tool
        run: docker compose run build-duet
      - name: ./build_oc.tool
        run: docker compose run build-oc
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux CLANGPDB Artifacts
          path: Binaries/*.zip

  build-linux-gcc5:
    name: Linux GCC
    runs-on: ubuntu-22.04
    env:
      TOOLCHAINS: GCC
    steps:
      - uses: actions/checkout@v4
      - name: Use Docker in rootless mode.
        uses: ScribeMD/rootless-docker@0.2.2
      - name: ./build_duet.tool
        run: docker compose run build-duet
      - name: ./build_oc.tool
        run: docker compose run build-oc
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux GCC Artifacts
          path: Binaries/*.zip

  build-linux-clangdwarf:
    name: Linux CLANGDWARF
    runs-on: ubuntu-22.04
    env:
      TOOLCHAINS: CLANGDWARF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
      - name: Use Docker in rootless mode.
        uses: ScribeMD/rootless-docker@0.2.2
      - name: ./build_duet.tool
        run: docker compose run build-duet
      - name: ./build_oc.tool
        run: docker compose run build-oc
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux CLANGDWARF Artifacts
          path: Binaries/*.zip

  build-linux-docs:
    name: Linux Docs
    runs-on: ubuntu-22.04
    env:
      TOOLCHAINS: DOCS
    steps:
      - uses: actions/checkout@v4
      - name: Use Docker in rootless mode.
        uses: ScribeMD/rootless-docker@0.2.2
      - name: ./build_duet.tool
        run: docker compose run build-duet
      - name: ./build_oc.tool
        run: docker compose run build-oc
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux Docs Artifacts
          path: Binaries/*.zip

  build-windows-vs2019:
    name: Windows VS2019
    runs-on: windows-2019
    env:
      TOOLCHAINS: VS2019
    steps:
      - uses: actions/checkout@v4
      - name: ./build_duet.tool
        shell: cmd
        run: build_duet.tool
      - name: ./build_oc.tool
        shell: cmd
        run: build_oc.tool
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows VS2019 Artifacts
          path: Binaries/*.zip
